[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powerk"
version = "0.1.0"
description = "Local control for the LG U+ / Jinheung MTTL-W01 smart strip"
requires-python = ">=3.11"
dependencies = ["fastapi==0.142.4", "uvicorn==0.54.0", "argon2-cffi==25.1.0", "websockets==17.2", "cryptography==50.0.2"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["powerk"]

[tool.setuptools.package-data]
powerk = ["web/index.html", "web/app.js", "web/app.css", "web/fonts/*.woff2", "common_passwords.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
